name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: python -m src.orchestrator --input examples/sample_customer_360.json --triggers-only --out /tmp/t
      - run: python -m src.orchestrator --input examples/sample_customer_360.json --offline --out /tmp/o
