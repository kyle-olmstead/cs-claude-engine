name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: python -m src.orchestrator --input examples/sample_customer_360.json --triggers-only --out /tmp/t
      - run: python -m src.orchestrator --input examples/sample_customer_360.json --offline --out /tmp/o
      - run: python scripts/sync_health_weights.py --check
      - run: python scripts/roi_model.py --json > /dev/null
  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt dbt-duckdb duckdb
      - name: Build the marts on DuckDB from the bundled seeds
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: |
          dbt seed --quiet
          dbt build --exclude resource_type:seed
      - name: SQL ↔ Python health-score parity
        run: python scripts/check_parity.py
  warehouses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt duckdb "sqlglot==30.23.0" "dbt-core==1.12.5" "dbt-duckdb==1.11.0" "dbt-snowflake==1.12.3" "dbt-bigquery==1.12.1" "dbt-databricks==1.12.7"
      - name: Marts match on Snowflake, BigQuery and Databricks (offline compile with each adapter, translated run on the seeds)
        run: python scripts/check_warehouses.py
